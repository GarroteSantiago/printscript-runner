spring:
  application:
    name: printscript-runner
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0: https://<tenant>.auth0.com/ (con la barra final)
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    context-parameters:
      # Mensaje WebSocket más grande que acepta Tomcat (por defecto 8 KiB): el start trae el snippet entero
      "[org.apache.tomcat.websocket.textBufferSize]": 1048576

logging:
  # json (one object per line, what New Relic ingests) or plain (readable, for local dev): logback-spring.xml
  console-format: ${LOG_FORMAT:json}
  structured:
    json:
      add:
        service: ${spring.application.name}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      # Latency: histograms, so percentiles can be aggregated across replicas
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  # Micrometer metrics to New Relic over OTLP; off until there is a license key
  otlp:
    metrics:
      export:
        enabled: ${NEW_RELIC_ENABLED:false}
        url: ${NEW_RELIC_OTLP_URL:https://otlp.nr-data.net/v1/metrics}
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY:}
        # New Relic prefers delta over cumulative
        aggregation-temporality: delta
        step: 60s

observability:
  # Internal port where /prometheus answers without a token (NGINX doesn't proxy it); 0 turns it off
  metrics-port: ${METRICS_PORT:9464}
  # How often the gauges of the streams (length, lag, pending) ask Redis
  stream-metrics-interval: 15s

# Consumidor de snippet:jobs (contracts/redis-streams.md)
streams:
  enabled: true
  # Vacío: el hostname del contenedor, así cada réplica es un consumidor distinto
  consumer-name: ${STREAMS_CONSUMER_NAME:}
  max-length: 10000
  batch-size: 10
  block: 2s
  reclaim-interval: 30s
  min-idle: 60s
  max-deliveries: 3

# Ejecución interactiva por WebSocket (/ws/run, contracts/websocket.md)
interactive-run:
  # Toda la ejecución, incluida la espera de inputs
  max-duration: ${RUN_MAX_DURATION:60s}
  # Espera de un input después de cada input-request
  input-timeout: ${RUN_INPUT_TIMEOUT:5m}
  # Tope de output por ejecución: mensajes y tamaño total
  max-outputs: ${RUN_MAX_OUTPUTS:10000}
  max-output-size: ${RUN_MAX_OUTPUT_SIZE:1MB}
